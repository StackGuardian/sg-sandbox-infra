name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Workflows run 1.11.14; one runs 1.8.8. Both are checked below.
  TOFU_VERSION: 1.11.14

jobs:
  fmt:
    name: tofu fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff

  roots:
    name: find OpenTofu roots
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: find
        # Every directory with .tf files is a root, except modules (validated
        # through the stacks that call them).
        run: |
          dirs=$(find . -name '*.tf' -not -path './modules/*' -not -path '*/.terraform/*' \
            -exec dirname {} \; | sed 's|^\./||' | sort -u | jq -R . | jq -cs .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "$dirs"

  validate:
    name: validate ${{ matrix.dir }} (tofu ${{ matrix.tofu }})
    needs: roots
    if: needs.roots.outputs.dirs != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.roots.outputs.dirs) }}
        tofu: ["1.11.14", "1.8.8"]
    env:
      # stacks/secrets-demo requires a token; this placeholder is not a secret.
      TF_VAR_api_token: ci-placeholder-token
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false
      - name: init and validate
        working-directory: ${{ matrix.dir }}
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: plan with defaults, no warnings
        working-directory: ${{ matrix.dir }}
        # Warnings on stderr fail drift runs on the platform, so they fail CI too.
        run: |
          tofu plan -input=false -lock=false -no-color 2> plan.err
          if [ -s plan.err ]; then cat plan.err; exit 1; fi

  policies:
    name: tirith lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install 'git+https://github.com/StackGuardian/tirith.git@1.2.1'
      - run: tirith lint --strict policies/
      - run: tirith fmt --check policies/
      - name: template forms are valid JSON
        run: for f in templates/*/schemas/*.json; do jq empty "$f" || exit 1; done

  ansible:
    name: ansible syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "ansible-core~=2.17.0"
      - run: |
          for p in templates/*/playbook.yml; do
            ansible-playbook --syntax-check -i localhost, "$p"
          done

  hygiene:
    name: hygiene scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: bash scripts/hygiene-scan.sh
